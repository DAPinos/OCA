<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - OCA Minimarkets</title>
    
    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lato:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Estilos -->
    <link rel="stylesheet" href="../assets/css/auth.css">
    
    <!-- Scripts -->
    <script src="../assets/js/auth.js" defer></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Lato', sans-serif; 
            background: #f8fafc; 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: #0A1F44; 
            padding: 20px;
        }
        .reset-container { 
            background: #FFFFFF; 
            padding: 2.5rem; 
            border-radius: 16px; 
            box-shadow: 0 20px 40px -12px rgba(10, 31, 68, 0.08); 
            width: 100%; 
            max-width: 450px;
        }
        .logo-container {
            text-align: center;
            margin-bottom: 2rem;
        }
        .logo {
            max-width: 100%;
            height: auto;
            max-height: 80px;
        }
        h1 {
            color: #1a365d;
            text-align: center;
            margin-bottom: 1.5rem;
            font-size: 1.75rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #4a5568;
        }
        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background-color: #f8fafc;
        }
        .form-control:focus {
            border-color: #4299e1;
            outline: none;
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.2);
            background-color: #fff;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 0.75rem 1rem;
            background: #1a365d;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            margin-top: 1.5rem;
        }
        .btn:hover {
            background: #2c5282;
            transform: translateY(-2px);
        }
        .password-wrapper {
            position: relative;
        }
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #a0aec0;
            cursor: pointer;
        }
        .password-hint {
            display: block;
            margin-top: 0.25rem;
            color: #718096;
            font-size: 0.75rem;
        }
        .message {
            padding: 1rem;
            margin-bottom: 1.5rem;
            border-radius: 8px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            animation: slideIn 0.3s ease-out;
        }
        .message i {
            margin-right: 0.5rem;
        }
        .error {
            background-color: #fff5f5;
            border-left: 4px solid #e53e3e;
            color: #c53030;
        }
        .success {
            background-color: #f0fff4;
            border-left: 4px solid #38a169;
            color: #2f855a;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.8rem;
            color: #a0aec0;
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="logo-container">
            <img src="img/logo-la-oca.svg" alt="Logo La Oca ERP" class="logo">
        </div>
        
        <h1>Restablecer Contraseña</h1>
        
        <div id="message" class="message" style="display: none;"></div>
        
        <form id="reset-password-form">
            <div class="form-group">
                <label for="new-password">Nueva Contraseña</label>
                <div class="password-wrapper">
                    <input type="password" id="new-password" class="form-control" 
                           placeholder="••••••••" required minlength="8">
                    <button type="button" class="toggle-password" aria-label="Mostrar/ocultar contraseña">
                        <i class="far fa-eye"></i>
                    </button>
                </div>
                <small class="password-hint">Mínimo 8 caracteres</small>
            </div>
            
            <div class="form-group">
                <label for="confirm-password">Confirmar Nueva Contraseña</label>
                <div class="password-wrapper">
                    <input type="password" id="confirm-password" class="form-control" 
                           placeholder="••••••••" required minlength="8">
                    <button type="button" class="toggle-password" aria-label="Mostrar/ocultar contraseña">
                        <i class="far fa-eye"></i>
                    </button>
                </div>
            </div>
            
            <button type="submit" class="btn">Actualizar Contraseña</button>
        </form>
        
        <div class="footer">
            &copy; 2023 La Oca ERP. Todos los derechos reservados.
        </div>
    </div>

    <!-- Scripts necesarios -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/services/auth.service.js"></script>
    <script>
        // Función para mostrar mensajes
        function showMessage(type, message) {
            const messageDiv = document.getElementById('message');
            if (!messageDiv) return;
            
            // Limpiar mensajes anteriores
            messageDiv.className = 'message';
            messageDiv.textContent = '';
            
            // Determinar el ícono según el tipo de mensaje
            let iconClass;
            if (type === 'error') {
                iconClass = 'fas fa-exclamation-circle';
                messageDiv.classList.add('error');
            } else if (type === 'success') {
                iconClass = 'fas fa-check-circle';
                messageDiv.classList.add('success');
            } else {
                iconClass = 'fas fa-info-circle';
                messageDiv.classList.add('info');
            }
            
            // Crear el contenido del mensaje
            const icon = document.createElement('i');
            icon.className = iconClass;
            messageDiv.appendChild(icon);
            messageDiv.appendChild(document.createTextNode(' ' + message));
            messageDiv.style.display = 'flex';
        }
        
        // Función para manejar el envío del formulario
        document.getElementById('reset-password-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            
            // Validar contraseñas
            if (newPassword !== confirmPassword) {
                showMessage('error', 'Las contraseñas no coinciden');
                return;
            }
            
            if (newPassword.length < 8) {
                showMessage('error', 'La contraseña debe tener al menos 8 caracteres');
                return;
            }
            
            try {
                // Obtener el token de la URL
                const urlParams = new URLSearchParams(window.location.search);
                const token = urlParams.get('token');
                
                if (!token) {
                    throw new Error('Token no válido o expirado');
                }
                
                // Aquí iría la llamada al backend para actualizar la contraseña
                // await authService.resetPassword(token, newPassword);
                
                // Simulación de éxito
                showMessage('success', 'Tu contraseña ha sido actualizada correctamente.');
                
                // Redirigir al login después de 2 segundos
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
                
            } catch (error) {
                console.error('Error al restablecer contraseña:', error);
                showMessage('error', 'Error al actualizar la contraseña. El enlace puede haber expirado.');
            }
        });
        
        // Toggle para mostrar/ocultar contraseña
        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('toggle-password') || e.target.closest('.toggle-password')) {
                const button = e.target.classList.contains('toggle-password') ? e.target : e.target.closest('.toggle-password');
                const input = button.previousElementSibling;
                const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                input.setAttribute('type', type);
                const icon = button.querySelector('i');
                if (icon) {
                    icon.classList.toggle('fa-eye');
                    icon.classList.toggle('fa-eye-slash');
                }
            }
        });
    </script>
</body>
</html>
