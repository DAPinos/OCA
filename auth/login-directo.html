<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Directo - OCA Minimarkets</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .logo {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        .title {
            color: #333;
            margin-bottom: 2rem;
            font-size: 1.5rem;
            font-weight: 600;
        }
        .user-btn {
            display: block;
            width: 100%;
            padding: 1rem;
            margin: 0.75rem 0;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
        }
        .admin-btn {
            background: linear-gradient(135deg, #ff6b6b, #ee5a52);
        }
        .admin-btn:hover {
            background: linear-gradient(135deg, #ee5a52, #dc4545);
            transform: translateY(-2px);
        }
        .client-btn {
            background: linear-gradient(135deg, #4ecdc4, #44a08d);
        }
        .client-btn:hover {
            background: linear-gradient(135deg, #44a08d, #3d8b7a);
            transform: translateY(-2px);
        }
        .prod-btn {
            background: linear-gradient(135deg, #ffa726, #ff9800);
        }
        .prod-btn:hover {
            background: linear-gradient(135deg, #ff9800, #f57c00);
            transform: translateY(-2px);
        }
        .status {
            margin: 1rem 0;
            padding: 0.75rem;
            border-radius: 8px;
            font-weight: 500;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">🏪</div>
        <h1 class="title">OCA Minimarkets</h1>
        
        <div id="status" class="status info">
            Selecciona tu usuario para acceder al sistema
        </div>
        
        <button class="user-btn admin-btn" onclick="loginDirect('admin')">
            👑 Administrador
        </button>
        
        <button class="user-btn client-btn" onclick="loginDirect('cliente')">
            👤 Cliente
        </button>
        
        <button class="user-btn prod-btn" onclick="loginDirect('produccion')">
            🏭 Producción
        </button>
    </div>

    <script>
        function updateStatus(message, type = 'info') {
            const status = document.getElementById('status');
            status.innerHTML = message;
            status.className = `status ${type}`;
        }
        
        function loginDirect(userType) {
            updateStatus('<div class="loading"></div> Iniciando sesión...', 'info');
            
            const users = {
                admin: {
                    id: 'demo_admin_001',
                    name: 'Administrador Demo',
                    email: 'admin@ocaminimarkets.com',
                    role: 'administrador',
                    department: 'administracion',
                    isDemo: true,
                    permissions: ['all']
                },
                cliente: {
                    id: 'demo_cliente_001',
                    name: 'Cliente Demo',
                    email: 'cliente@ocaminimarkets.com',
                    role: 'cliente',
                    department: null,
                    isDemo: true,
                    permissions: ['profile', 'orders']
                },
                produccion: {
                    id: 'demo_produccion_001',
                    name: 'Producción Demo',
                    email: 'produccion@ocaminimarkets.com',
                    role: 'produccion',
                    department: 'produccion',
                    isDemo: true,
                    permissions: ['production', 'inventory']
                }
            };
            
            const user = users[userType];
            if (!user) {
                updateStatus('❌ Usuario no válido', 'error');
                return;
            }
            
            // Crear token único
            const timestamp = Date.now();
            const token = `demo_${user.id}_${timestamp}`;
            
            // Limpiar cualquier sesión anterior
            localStorage.clear();
            
            // Guardar datos de sesión
            localStorage.setItem('authToken', token);
            localStorage.setItem('userData', JSON.stringify(user));
            localStorage.setItem('sessionActive', 'true');
            localStorage.setItem('lastLogin', new Date().toISOString());
            localStorage.setItem('loginTimestamp', timestamp.toString());
            
            updateStatus(`✅ Sesión iniciada como ${user.name}`, 'success');
            
            // Redirigir al sistema principal
            setTimeout(() => {
                updateStatus('<div class="loading"></div> Accediendo al sistema...', 'info');
                
                // Construir URL de destino de forma absoluta
                const currentUrl = window.location.href;
                const baseUrl = currentUrl.replace('login-directo.html', 'index.html');
                
                // Agregar parámetros de sesión
                const params = new URLSearchParams({
                    sessionId: token,
                    userId: user.id,
                    role: user.role,
                    timestamp: timestamp,
                    source: 'direct_login'
                });
                
                const finalUrl = `${baseUrl}?${params.toString()}`;
                
                console.log('=== LOGIN DIRECTO ===');
                console.log('Usuario:', user.name);
                console.log('Token:', token);
                console.log('URL actual:', currentUrl);
                console.log('URL destino:', finalUrl);
                console.log('Datos guardados:', {
                    authToken: localStorage.getItem('authToken'),
                    userData: localStorage.getItem('userData'),
                    sessionActive: localStorage.getItem('sessionActive')
                });
                
                // Redirigir usando replace para evitar historial
                window.location.replace(finalUrl);
                
            }, 1500);
        }
        
        // Verificar si ya hay una sesión al cargar
        window.addEventListener('load', () => {
            const existingToken = localStorage.getItem('authToken');
            const existingUser = localStorage.getItem('userData');
            
            if (existingToken && existingUser) {
                try {
                    const user = JSON.parse(existingUser);
                    updateStatus(`Sesión existente detectada: ${user.name}`, 'success');
                    
                    // Ofrecer continuar o limpiar
                    setTimeout(() => {
                        if (confirm(`Ya tienes una sesión activa como ${user.name}. ¿Quieres continuar?`)) {
                            window.location.replace('index.html');
                        } else {
                            localStorage.clear();
                            updateStatus('Sesión anterior limpiada', 'info');
                        }
                    }, 1000);
                } catch (error) {
                    console.error('Error en sesión existente:', error);
                    localStorage.clear();
                    updateStatus('Sesión corrupta limpiada', 'error');
                }
            }
        });
    </script>
</body>
</html>
